spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mariadb://localhost:3306/cafe_auth
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka