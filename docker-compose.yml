services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-contenedor
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafeteria_db

  usuario-service:
    build:
      context: ./usuario  # <-- Esto le dice a Docker: "Entra a la carpeta usuario"
    container_name: usuario-service-contenedor
    ports:
      - "8081:8081"
    depends_on:
      - mysql-db

  menu-service:
    build:
      context: ./menu     # <-- Esto le dice a Docker: "Entra a la carpeta menu"
    container_name: menu-service-contenedor
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
    depends_on:
      - mysql-db
