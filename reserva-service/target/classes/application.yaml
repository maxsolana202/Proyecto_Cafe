server:
  port: 8081

spring:
  application:
    name: reserva-service

  datasource:
    url: jdbc:mysql://172.28.240.1:3306/reservas_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://172.28.240.1:8761/eureka/

  instance:
    prefer-ip-address: true
