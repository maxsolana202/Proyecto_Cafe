server:
  port: 8081

spring:
  application:
    name: reserva-service

  datasource:
    url: jdbc:mysql://localhost:3306/reservas_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
